<style>
:root{
  --plum:#3F0B3E; --plum-deep:#2A0729; --plum-mid:#5B1358;
  --magenta:#A81C6B; --olive:#8A8C2C;
  --ink:#241F26; --line:#E6DEE7;
  --sans:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;color:#fff;font-family:var(--sans);font-size:17px;line-height:1.7;overflow-x:hidden;

    radial-gradient(760px 520px at 4% 96%,rgba(138,140,44,.30),transparent 64%),
    linear-gradient(160deg,var(--plum-deep) 0%,var(--plum) 48%,var(--plum-mid) 100%);
  background-attachment:fixed;}
a{color:#F2B8DA}
:focus-visible{outline:3px solid var(--olive);outline-offset:3px;border-radius:3px}
.topbar{padding:16px clamp(20px,5vw,40px);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.14)}
.mark{font-size:.95rem;letter-spacing:.42em;font-weight:600;color:#fff}
.note{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.68)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:clamp(40px,8vw,90px) clamp(20px,5vw,40px)}
.card{max-width:720px;width:100%;text-align:center}
.check{width:76px;height:76px;margin:0 auto 26px;border-radius:50%;background:rgba(138,140,44,.18);border:1px solid rgba(138,140,44,.6);display:flex;align-items:center;justify-content:center}
.kicker{display:inline-block;font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;font-weight:600;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.3);padding:7px 16px;border-radius:999px;margin-bottom:22px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.1;letter-spacing:-.02em;margin:0 0 18px}
.lead{font-size:clamp(1rem,2.2vw,1.15rem);color:rgba(255,255,255,.86);margin:0 auto 8px;max-width:34em}
.title{font-family:var(--serif);font-style:italic;font-size:clamp(1.2rem,3vw,1.6rem);color:#F2B8DA;margin:14px 0 6px}
.ready{color:rgba(255,255,255,.86);margin:0 0 34px}
.bar{width:80px;height:3px;background:var(--olive);margin:0 auto 34px}
.cta{display:inline-block;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;background:var(--olive);color:#fff;border:1px solid var(--olive);border-radius:999px;padding:17px 36px;text-decoration:none;min-height:48px}
.cta:hover{background:#9ea233;border-color:#9ea233;color:#fff}
.smallnote{margin-top:26px;font-size:.86rem;color:rgba(255,255,255,.6)}
footer{padding:26px clamp(20px,5vw,40px);border-top:1px solid rgba(255,255,255,.14);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:.85rem;color:rgba(255,255,255,.7)}
@media(max-width:520px){.cta{display:block;width:100%}}

<header class="topbar">
